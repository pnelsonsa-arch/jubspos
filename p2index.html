<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B131D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>The Jubilee POS &amp; GRV</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <script src="./tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0B131D;
      --surface: #131E2D;
      --surface-2: #1B293D;
      --border: #263852;
      --accent: #16C4E0;
      --accent-dark: #0E8FA6;
      --text: #F1F5F9;
      --muted: #94A3B8;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
      line-height: 1.4;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 19, 29, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      border: 2px solid var(--accent);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: var(--accent);
      font-size: 18px;
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .brand small {
      display: block;
      font-size: 11px;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .status-pill.online { color: var(--success); border-color: rgba(16, 185, 129, 0.35); }
    .status-pill.offline { color: var(--warning); border-color: rgba(245, 158, 11, 0.35); }

    /* Buttons */
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 14px;
      transition: transform 0.08s ease, opacity 0.15s ease;
    }

    button:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: #061018;
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-success {
      background: var(--success);
      color: #051B11;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #FCA5A5;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    /* Bottom Nav */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 4px;
    }

    nav.bottom-nav button {
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 4px;
      font-size: 12px;
      border-radius: 8px;
    }

    nav.bottom-nav button.active {
      color: var(--accent);
      background: rgba(22, 196, 224, 0.1);
    }

    nav.bottom-nav span.icon {
      font-size: 18px;
    }

    /* Layout Containers */
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* POS Specific */
    .pos-total-box {
      background: linear-gradient(135deg, #132338, #0D1724);
      border: 1px solid var(--accent-dark);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }

    .pos-total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .pos-grand-total {
      font-size: 32px;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .pos-sub-stats {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .quick-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: left;
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 68px;
    }

    .quick-item:active {
      border-color: var(--accent);
    }

    .quick-item .name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .quick-item .price {
      font-size: 13px;
      color: var(--accent);
      font-weight: 700;
    }

    .cart-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .cart-row:last-child { border-bottom: none; }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-controls button {
      width: 28px;
      height: 28px;
      padding: 0;
      display: grid;
      place-items: center;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* Camera & OCR */
    video, canvas.preview-canvas {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 10px;
      background: #05090E;
      border: 1px solid var(--border);
      display: none;
      margin-top: 10px;
    }

    .margin-pills {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin: 8px 0 12px;
    }

    .margin-pill {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 4px;
      font-size: 13px;
      text-align: center;
    }

    .margin-pill.active {
      background: var(--accent);
      color: #061018;
      border-color: var(--accent);
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(22, 196, 224, 0.15);
      color: var(--accent);
    }

    .toast {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      background: #1E293B;
      color: #fff;
      border: 1px solid var(--accent);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      z-index: 60;
      box-shadow: 0 10px 25px rgba(0,0,0,0.45);
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-badge">J</div>
      <div>
        <h1>The Jubilee</h1>
        <small>POS &middot; Scan &middot; GRV (ZAR)</small>
      </div>
    </div>
    <div class="header-actions">
      <span id="netStatus" class="status-pill">Checking...</span>
      <button id="installBtn" class="btn-primary btn-sm" style="display:none;">Install App</button>
    </div>
  </header>

  <div id="toast" class="toast"></div>

  <main>
    <!-- ==================== TAB 1: POS ==================== -->
    <section id="tab-pos" class="tab-panel active">
      <div class="pos-total-box">
